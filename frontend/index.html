    <!-- Script para otimizar carregamento de CSS (deferir CSS não crítico) -->
    <script>

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          // CSS será injetado pelo Vite, mas podemos otimizar com preload
          var cssLinks = document.querySelectorAll('link[rel="stylesheet"]');
          cssLinks.forEach(function(link) {
            if (link.href && !link.media || link.media === 'all') {
              // Marcar como não crítico após FCP
              link.media = 'all';
            }
          });
        });
      }
    </script>

    <!-- Google Tag Manager - Carregado após LCP para não bloquear renderização -->
    <script>
      // Carregar GTM apenas após LCP ou após 2.5s (tempo máximo ideal de LCP)
      (function() {
        function loadGTM() {
          // Carregar script do GTM
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=AW-448210685';
          document.head.appendChild(script);
          
          // Inicializar dataLayer e gtag
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'AW-448210685');
        }
        
        // Tentar carregar após LCP usando PerformanceObserver
        if ('PerformanceObserver' in window) {
          try {
            var observer = new PerformanceObserver(function(list) {
              var entries = list.getEntries();
              var lcpEntry = entries[entries.length - 1];
              if (lcpEntry && lcpEntry.entryType === 'largest-contentful-paint') {
                // LCP detectado, aguardar um pouco mais e carregar GTM
                setTimeout(loadGTM, 500);
                observer.disconnect();
              }
            });
            observer.observe({ entryTypes: ['largest-contentful-paint'] });
            
            // Timeout de segurança: carregar após 3s mesmo se LCP não for detectado
            setTimeout(function() {
              observer.disconnect();
              loadGTM();
            }, 3000);
          } catch (e) {
            // Fallback se PerformanceObserver falhar
            setTimeout(loadGTM, 2500);
          }
        } else {
          // Fallback para navegadores sem PerformanceObserver
          setTimeout(loadGTM, 2500);
        }
      })();
    </script>
