# ============================================================================
# CONFIGURAÇÃO NGINX PARA ATHLETIA.SITE
# ============================================================================
# 
# Este arquivo deve ser copiado para: /etc/nginx/sites-available/athletia.site
# E então criar um link simbólico: ln -s /etc/nginx/sites-available/athletia.site /etc/nginx/sites-enabled/
#
# Após configurar, testar com: nginx -t
# E recarregar com: systemctl reload nginx
# ============================================================================

# ============================================================================
# HTTP → HTTPS REDIRECT
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name athletia.site www.athletia.site;
    return 301 https://$host$request_uri;
}

# ============================================================================
# HTTPS PRINCIPAL
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name athletia.site www.athletia.site;

    # Certificados SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/athletia.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athletia.site/privkey.pem;

    # Configurações SSL modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logs
    access_log /var/log/nginx/athletia-access.log;
    error_log  /var/log/nginx/athletia-error.log;

    # Tamanho máximo de upload
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ========================================================================
    # MEDIA (UPLOADS) - DEVE VIR PRIMEIRO (PRIORIDADE ABSOLUTA)
    # ========================================================================
    # Serve arquivos de upload diretamente do sistema de arquivos
    # Caminho: /opt/athletia/backend/upload/
    location ^~ /media/ {
        alias /opt/athletia/backend/upload/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Desabilitar directory listing por segurança
        autoindex off;
        
        # Tentar servir arquivo, retornar 404 se não existir
        try_files $uri =404;
    }

    # ========================================================================
    # WEBSOCKET (Socket.IO) - DEVE VIR ANTES DE /api/
    # ========================================================================
    location /socket.io/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers essenciais
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts para WebSocket (24 horas)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Desabilitar buffering para WebSocket
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ========================================================================
    # BACKEND API
    # ========================================================================
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        # Headers essenciais
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # SEGURANÇA: CORS é configurado pelo backend Express
        # Não adicionar headers CORS aqui para evitar conflitos
        # O backend já configura CORS corretamente com origens específicas

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ========================================================================
    # ARQUIVOS ESTÁTICOS DO FRONTEND
    # ========================================================================
    root /opt/athletia/frontend/dist;
    index index.html;

    # Assets com cache longo (JS, CSS compilados)
    location ^~ /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Expires "Thu, 31 Dec 2026 23:59:59 GMT" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
    
    # Outros arquivos estáticos (imagens, fontes, etc.) do frontend
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Expires "Thu, 31 Dec 2026 23:59:59 GMT" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
    
    # CSS e JS que não estão em /assets/
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Expires "Thu, 31 Dec 2026 23:59:59 GMT" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
    
    # Cache para HTML com tempo menor (para permitir atualizações)
    location ~* \.html$ {
        add_header Cache-Control "public, must-revalidate, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Servir index.html para todas as rotas do frontend (SPA)
    # Esta location deve vir POR ÚLTIMO para capturar todas as outras rotas
    location / {
        try_files $uri $uri/ /index.html;
        
        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ========================================================================
    # COMPRESSÃO GZIP
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/rss+xml application/xhtml+xml application/x-font-ttf application/vnd.ms-fontobject font/truetype font/opentype image/svg+xml application/font-woff application/font-woff2 font/woff font/woff2;
    gzip_disable "msie6";
    gzip_min_length 1000;
    add_header Vary "Accept-Encoding" always;
}
