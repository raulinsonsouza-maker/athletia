# ============================================================================
# CONFIGURAÇÃO NGINX PARA ATHLETIA.SITE
# ============================================================================
# Este arquivo deve ser copiado para: /etc/nginx/sites-available/athletia.site
# Testar com: nginx -t
# Recarregar com: systemctl reload nginx
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name athletia.site www.athletia.site;
    return 301 https://athletia.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.athletia.site;

    ssl_certificate /etc/letsencrypt/live/athletia.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athletia.site/privkey.pem;

    return 301 https://athletia.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name athletia.site;

    ssl_certificate /etc/letsencrypt/live/athletia.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athletia.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/athletia-access.log;
    error_log  /var/log/nginx/athletia-error.log;

    client_max_body_size 50M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    rewrite ^/(.+)/$ /$1 permanent;

    root /opt/athletia/frontend/dist;
    index index.html;

    error_page 404 /seo-404.html;

    location = /seo-404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /feed.xml {
        proxy_pass http://127.0.0.1:3001/api/feed.xml;
        proxy_set_header Host $host;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:3001/api/llms.txt;
        proxy_set_header Host $host;
    }

    location = /llms-full.txt {
        proxy_pass http://127.0.0.1:3001/api/llms-full.txt;
        proxy_set_header Host $host;
    }

    location ~ "^/([A-Za-z0-9]{16,128})\.txt$" {
        proxy_pass http://127.0.0.1:3001/api/indexnow/$1.txt;
        proxy_set_header Host $host;
    }

    location = /termos {
        proxy_pass http://127.0.0.1:3001/api/seo-html/termos;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
    }

    location = /privacidade {
        proxy_pass http://127.0.0.1:3001/api/seo-html/privacidade;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
    }

    location = /cookies {
        proxy_pass http://127.0.0.1:3001/api/seo-html/cookies;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
    }

    location ^~ /blog {
        proxy_pass http://127.0.0.1:3001/api/seo-html$request_uri;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
    }

    location ^~ /guia {
        proxy_pass http://127.0.0.1:3001/api/seo-html$request_uri;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
    }

    location ^~ /media/ {
        alias /opt/athletia/backend/upload/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        autoindex off;
        try_files $uri =404;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(one-page|landing-test|home|cadastro|checkout|confirmacao|pagamento-sucesso|assinatura-confirmada|login|register|reset-password|trial-expirado|dashboard|meu-plano|treino-rapido|treinos|treino|historico|progresso|estatisticas|perfil|evolucao-peso|evolucao|exercicios|gerenciar-treinos|admin)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        rewrite ^ /index.html break;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/rss+xml application/xhtml+xml image/svg+xml font/woff font/woff2;
    gzip_disable "msie6";
    gzip_min_length 1000;
}
